# Nginx reverse proxy for VidOps Storage Broker over internal HTTPS
# Bind to internal/VPN interface only; enforce IP allowlist. Optional mTLS.

server {
    # Bind to internal IP only; adjust to your server's LAN IP
    # Example: listen 192.168.0.187:8443 ssl http2;
    listen 192.168.0.1:8443 ssl http2; # placeholder; replaced on deploy
    server_name broker.internal;

    # TLS certs (ACME/internal CA)
    ssl_certificate     /etc/ssl/certs/broker.crt;
    ssl_certificate_key /etc/ssl/private/broker.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_prefer_server_ciphers on;

    # Network policy: allow only worker ranges (local subnet)
    allow 192.168.0.0/24;
    deny all;

    # Optional mTLS
    # ssl_verify_client on;
    # ssl_client_certificate /etc/nginx/ca.pem;

    client_max_body_size 15g;   # adjust for largest uploads
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Tight health check
    location /healthz {
        proxy_pass http://127.0.0.1:8443/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }
}
