# pytest.ini
[pytest]
minversion = 6.0
addopts = -ra -s --strict-markers --timeout=180 --durations=10 --color=yes
testpaths = tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    unit: Mark a test as a unit test (no external dependencies).
    integration: Mark a test as an integration test (requires external services, e.g., DB).
    e2e: Mark a test as an end-to-end test (full system interaction).
    smoke: Minimal reproducible workflow validation (DB + worker subprocess).

# Suppress warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:psycopg2.*
    ignore::DeprecationWarning:yaml.*
