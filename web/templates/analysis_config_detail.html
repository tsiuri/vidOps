{% extends "base.html" %}
{% block nav_configs %}active{% endblock %}
{% block content %}
<div class="container">
  <h1>Analysis Config: {{ config_id or "New" }}</h1>
  <p><a href="{{ url_for('list_analysis_configs') }}">&larr; Back to list</a></p>
  {% if error %}
    <div style="color: red; margin-bottom: 1em;">{{ error }}</div>
  {% endif %}
  <form method="post">
    <div>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" style="width: 60%;">
    </div>
    <div>
      <label for="analysis_type">Analysis Type:</label>
      <input type="text" id="analysis_type" name="analysis_type" value="{{ analysis_type or '' }}">
    </div>
    <div>
      <label for="version">Version:</label>
      <input type="number" id="version" name="version" value="{{ version or 1 }}">
    </div>
    <div>
      <label for="is_default">
        <input type="checkbox" id="is_default" name="is_default" value="1" {% if is_default %}checked{% endif %}>
        Default for this analysis_type
      </label>
    </div>
    <div style="margin-top: 1em;">
      <label for="config_json">Config JSON (AnalysisConfig):</label><br>
      <textarea id="config_json" name="config_json" rows="30" style="width: 100%;">{{ config_json }}</textarea>
    </div>
    <div style="margin-top: 1em;">
      <button type="submit">Save</button>
    </div>
  </form>
</div>
{% endblock %}
