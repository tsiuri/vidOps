<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Transcript Analysis{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f5f5f5; color:#333; }
    header { background:#2c3e50; color:#fff; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    a { color: #3498db; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { display:flex; gap:16px; align-items:center; }
    .nav a { color:#ecf0f1; opacity:.9; }
    .nav a.active { font-weight:600; opacity: 1; }
    .card { background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1); }
  </style>
  {% block head %}{% endblock %}
  <script>
    // Basic helper used by multiple pages
    function escapeHtml(text){ const div=document.createElement('div'); div.textContent=text??''; return div.innerHTML; }
  </script>
</head>
<body>
  <header>
    <div class="container">
      <div class="nav">
        <h1 style="margin:0; font-size:1.4rem;">Transcript Analysis</h1>
        <div style="flex:1"></div>
        <a href="/" class="{% block nav_home %}{% endblock %}">Home</a>
        <a href="/videos" class="{% block nav_videos %}{% endblock %}">Videos</a>
        <a href="/dbsearch" class="{% block nav_dbsearch %}{% endblock %}">DBSearch</a>
        <a href="/analysis-configs" class="{% block nav_configs %}{% endblock %}">Analysis Configs</a>
        <a href="/quickclip" class="{% block nav_quickclip %}{% endblock %}">QuickClips</a>
        <a href="/jobs" class="{% block nav_jobs %}{% endblock %}">Jobs</a>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top:20px; margin-bottom:40px;">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
